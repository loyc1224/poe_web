<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>倉庫統計 | POE 知識庫</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { --bg:#15171b; --surface:#20242b; --line:#363d47; --text:#eef2f5; --muted:#a4adb8; --accent:#56d6b1; --warning:#f3c56c; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:var(--bg); font-family:'Noto Sans TC',serif; font-size:14px; }
    button,input,select,a { font:inherit; letter-spacing:0; }
    button,select,input { border:1px solid var(--line); border-radius:5px; color:var(--text); background:var(--surface); padding:8px 10px; }
    button { cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button:hover:not(:disabled),a.action:hover { border-color:var(--accent); }
    svg { width:16px; height:16px; flex-shrink:0; }
    input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; margin:0; flex-shrink:0; }
    a { color:var(--accent); text-decoration:none; }
    .page { max-width:1320px; padding:24px; margin:auto; }
    .header,.toolbar,.section-title,.tab-label,.item-name { display:flex; align-items:center; gap:10px; }
    .header { justify-content:space-between; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:18px; }
    h1 { font-size:24px; margin:0; font-weight:700; }
    h2 { font-size:16px; margin:0; }
    .toolbar { flex-wrap:wrap; }
    .action { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); padding:8px 10px; border-radius:5px; }
    .action[aria-disabled=true] { opacity:.45; cursor:not-allowed; }
    .status { color:var(--muted); font-size:12px; padding:12px 0; display:flex; flex-wrap:wrap; gap:12px; }
    .notice { color:var(--warning); min-height:22px; margin-bottom:10px; }
    .overview { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; border-block:1px solid var(--line); padding:20px 0; }
    .section-title { justify-content:space-between; flex-wrap:wrap; }
    .total { font-size:30px; font-weight:700; margin:12px 0 2px; }
    .muted { color:var(--muted); font-size:12px; }
    .plot { height:180px; position:relative; margin-top:12px; }
    .categories { max-height:242px; overflow:auto; padding-top:12px; }
    .category { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; margin-bottom:14px; }
    .category progress { grid-column:1/-1; height:5px; width:100%; accent-color:var(--accent); }
    .content { display:grid; grid-template-columns:240px minmax(0,1fr); gap:24px; padding-top:24px; }
    .tabs { border-right:1px solid var(--line); padding-right:18px; }
    .tab-list { max-height:65vh; overflow:auto; margin-top:12px; }
    .tab-label { border-left:4px solid transparent; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; overflow-wrap:anywhere; }
    .tab-label span { min-width:0; }
    .tab-label small { margin-left:auto; white-space:nowrap; color:var(--muted); }
    .items-tools { display:flex; gap:8px; flex-wrap:wrap; padding-bottom:12px; }
    #search { flex:1 1 200px; min-width:0; }
    .table-scroll { max-height:65vh; overflow:auto; border:1px solid var(--line); border-radius:5px; }
    table { width:100%; border-collapse:collapse; min-width:660px; }
    th { text-align:left; background:var(--surface); position:sticky; top:0; z-index:1; }
    th,td { padding:11px 12px; border-bottom:1px solid var(--line); font-size:13px; }
    td.number { white-space:nowrap; font-variant-numeric:tabular-nums; }
    tbody tr:hover { background:#252a32; }
    .item-name img { width:28px; height:28px; object-fit:contain; }
    .item-name span { overflow-wrap:anywhere; }
    .empty { padding:30px 16px; color:var(--muted); text-align:center; }
    .selected { color:var(--accent); }
    .connection-dialog { width:min(480px,calc(100% - 32px)); padding:22px; border:1px solid var(--line); border-radius:6px; color:var(--text); background:var(--surface); }
    .connection-dialog::backdrop { background:rgba(0,0,0,.65); }
    .setup-row { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
    .setup-row code { overflow-wrap:anywhere; font-size:12px; }
    .setup-row span { white-space:nowrap; }
    .connection-footer { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-top:18px; }
    .session-warning { margin-top:18px; padding:12px; border-left:3px solid var(--warning); background:#292720; color:#f0dfb0; font-size:12px; line-height:1.6; }
    .session-form { display:grid; gap:12px; margin-top:14px; }
    .session-field { display:grid; gap:6px; }
    .session-field input { width:100%; }
    .session-consent { display:flex; align-items:flex-start; gap:8px; color:var(--muted); font-size:12px; line-height:1.5; }
    .session-consent input { margin-top:2px; }
    #sessionConnect { justify-self:start; }
    .auto { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
    @media(max-width:700px) {
      .page { padding:16px; }
      .overview,.content { grid-template-columns:minmax(0,1fr); gap:20px; }
      .tabs { border-right:0; padding-right:0; border-bottom:1px solid var(--line); padding-bottom:18px; }
      .tab-list { max-height:240px; }
      .toolbar { width:100%; }
      h1 { font-size:22px; }
    }
  </style>
<body>
  <main class="page">
    <header class="header">
      <div><a href="/">POE 知識庫</a><h1>倉庫統計</h1></div>
      <div class="toolbar">
        <select id="game" aria-label="遊戲"><option value="poe1">POE1 台服</option><option value="poe2" disabled>POE2 尚未開放私人倉庫 API</option></select>
        <input id="league" aria-label="聯盟" placeholder="聯盟" size="12">
        <a class="action" id="connect" href="/api/pricer/oauth/start?return_to=stash"><i data-lucide="log-in"></i><span id="connectLabel">連結帳號</span></a>
        <button id="connectionSettings" type="button" title="查看帳號連線設定" aria-label="查看帳號連線設定"><i data-lucide="settings"></i></button>
        <button id="sync" type="button" disabled><i data-lucide="refresh-cw"></i>同步估值</button>
        <button id="disconnect" type="button" disabled title="斷開帳號並清除本站倉庫資料" aria-label="斷開帳號"><i data-lucide="log-out"></i></button>
      </div>
    </header>
    <div class="status"><span id="account">未連結帳號</span><span id="updated">尚未同步</span><span id="unknown"></span></div>
    <div class="notice" id="notice" role="status"></div>
    <section class="overview">
      <div>
        <div class="section-title"><h2>已選倉庫估值</h2><select id="range" aria-label="快照期間"><option value="7">7 天</option><option value="30">30 天</option><option value="90">90 天</option></select><select id="chartMode" aria-label="快照模式"><option value="total">總覽</option><option value="hourly">每小時變化</option></select></div>
        <div class="total" id="total">—</div><div class="muted" id="snapshotCount">尚無快照</div>
        <div class="plot"><canvas id="historyChart" aria-label="倉庫估值歷史"></canvas></div>
      </div>
      <div><div class="section-title"><h2>分類占比</h2><button id="percent" type="button" aria-pressed="false" title="切換百分比或估值">%</button></div><div class="categories" id="categories"><div class="empty">尚無分類</div></div></div>
    </section>
    <section class="content">
      <aside class="tabs"><div class="section-title"><h2>分頁</h2><button id="allTabs" type="button" title="選取全部分頁" aria-label="選取全部分頁"><i data-lucide="check-check"></i></button><button id="clearTabs" type="button" title="清除分頁選取" aria-label="清除分頁選取"><i data-lucide="square"></i></button></div><div class="muted" id="tabCount">已選 0 / 0</div><div class="tab-list" id="tabs"><div class="empty">尚無倉庫分頁</div></div></aside>
      <div><div class="items-tools"><select id="category" aria-label="物品分類"><option value="">全部分類</option></select><input id="search" type="search" placeholder="搜尋物品" aria-label="搜尋物品"><select id="sort" aria-label="物品排序"><option value="value">估值</option><option value="quantity">數量</option><option value="name">名稱</option></select><label class="auto"><input id="autoSync" type="checkbox">自動同步</label></div>
        <div class="table-scroll"><table><thead><tr><th>計入</th><th>名稱</th><th>數量</th><th>估值</th><th>分頁</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">尚無物品</td></tr></tbody></table></div>
      </div>
    </section>
  </main>
  <dialog class="connection-dialog" id="connectionDialog" aria-labelledby="connectionTitle">
    <div class="section-title"><h2 id="connectionTitle">帳號連線設定</h2><button id="closeConnectionDialog" type="button" title="關閉" aria-label="關閉連線設定"><i data-lucide="x"></i></button></div>
    <div class="notice" id="connectionError"></div>
    <div id="connectionRequirements"></div>
    <div class="session-warning">POESESSID 是完整登入 session，不是官方 OAuth token。送出後會傳到本站伺服器並加密保存，僅用於 PoE1 倉庫同步。此方式呼叫未列於官方 API 文件的網站 endpoint，可能失效或不符合 GGG 條款；只有在你了解並接受風險時才繼續。可隨時斷開並刪除本站保存的資料。</div>
    <form id="sessionForm" class="session-form">
      <label class="session-field">Path of Exile 帳號名稱<input id="sessionAccount" name="account_name" autocomplete="username" maxlength="80" required></label>
      <label class="session-field">POESESSID<input id="sessionCookie" name="poe_session" type="password" autocomplete="off" spellcheck="false" inputmode="text" maxlength="32" pattern="[A-Fa-f0-9]{32}" required></label>
      <label class="session-consent"><input id="sessionConsent" type="checkbox" required><span>我了解這會把完整登入 session 傳送並加密保存於本站，且使用非官方文件化的倉庫 endpoint。</span></label>
      <button id="sessionConnect" type="submit" disabled><i data-lucide="key-round"></i>連結並同步</button>
    </form>
    <div class="connection-footer"><a href="https://www.pathofexile.com/developer/docs/authorization" target="_blank" rel="noopener noreferrer">官方 OAuth 規範 ↗</a><span class="muted">PoE1 · Session Cookie 模式</span></div>
  </dialog>
  <script>
    if (window.lucide) lucide.createIcons();
    let state = {};
    let chart;
    let busy = false;
    let percent = false;
    let autoTimer;
    const element = id => document.getElementById(id);
    const money = value => value == null ? '未估價' : `${Number(value).toLocaleString('zh-Hant', {maximumFractionDigits:4})} d`;
    const create = (tag, text, className) => { const node = document.createElement(tag); if (text != null) node.textContent = text; if (className) node.className = className; return node; };
    const errors = {'missing+POE_TW_CLIENT_ID':'尚未設定本站官方 OAuth client。','missing+POE_TW_CLIENT_SECRET':'尚未設定本站 OAuth client secret。','missing+STASH_STORAGE_BUCKET':'尚未設定正式倉庫持久儲存。','client_redirect_mismatch+poetwpricer':'你提供的是 poepricer 的 OAuth client，授權只適用於該網站，且回呼固定為 poepricer.com。本站必須使用官方核發給本站的 client，不能轉用別站的授權。','invalid+POE_TW_REDIRECT_URI':'官方回呼網址設定無效。'};

    async function loadState() {
      const response = await fetch('/api/stash/state', {cache:'no-store'});
      if (!response.ok) throw new Error('倉庫狀態讀取失敗');
      state = await response.json();
      render();
    }
    async function action(path, payload) {
      if (busy) return;
      busy = true; renderControls(); element('notice').textContent = '處理中…';
      try {
        const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || '操作失敗');
        await loadState();
      } catch (error) {
        element('notice').textContent = error.message;
        if (element('autoSync').checked) { element('autoSync').checked = false; clearInterval(autoTimer); }
      } finally { busy = false; renderControls(); }
    }
    function renderControls() {
      const connected = state.oauth_connected || state.session_connected;
      element('sync').disabled = busy || !connected;
      element('disconnect').disabled = busy || (!connected && !state.valuation);
      element('autoSync').disabled = busy || !connected;
      element('connect').removeAttribute('aria-disabled');
      element('connectLabel').textContent = state.session_connected ? '已使用 Session 連結' : '連結帳號';
      element('connect').title = state.oauth_configured ? '透過官方 OAuth 連結帳號' : '使用 POESESSID 連結帳號';
      element('sessionConnect').disabled = busy || !element('sessionConsent').checked;
      for (const id of ['allTabs','clearTabs']) element(id).disabled = busy || !(state.valuation?.tabs?.length);
      for (const checkbox of document.querySelectorAll('#tabs input,#rows input')) checkbox.disabled = busy;
    }
    function selection(selected, excluded) {
      return action('/api/stash/selection', {selected_tabs:selected, excluded_items:excluded});
    }
    function selectedTabs() { return (state.valuation?.tabs || []).filter(tab => tab.included).map(tab => tab.id); }
    function excludedItems() { return state.selection?.excluded_items || []; }
    function render() {
      const connected = state.oauth_connected || state.session_connected;
      element('account').textContent = state.account_name || (connected ? '已連結，尚未同步' : '未連結帳號');
      const syncTime = state.updated_at ? `已同步 · ${new Date(state.updated_at*1000).toLocaleString('zh-TW')}` : '尚未同步';
      element('updated').textContent = state.session_connected ? `${syncTime} · POESESSID` : syncTime;
      if (!element('league').value && state.league) element('league').value = state.league;
      const authorization = new URLSearchParams(window.location.search);
      const authorizationError = authorization.get('oauth') === 'error' ? authorization.get('message') : '';
      const authorizationMessage = authorizationError === 'missing+POE_TW_CLIENT_ID'
        ? '未開啟官方授權：本站尚未設定已註冊的 OAuth client ID。'
        : errors[authorizationError] || (authorizationError ? `官方授權未完成：${authorizationError}` : '');
      element('notice').textContent = state.session_connected
        ? '目前使用 POESESSID session-cookie 模式；此方式不是官方 OAuth。'
        : authorizationError ? authorizationMessage : errors[state.config_error] || '';
      element('unknown').textContent = state.valuation ? `${state.valuation.unpriced_count} 件未估價` : '';
      element('total').textContent = state.valuation ? money(state.valuation.total_divine) : '—';
      renderTabs(); renderCategories(); renderRows(); renderChart(); renderControls();
    }
    function renderTabs() {
      const tabs = state.valuation?.tabs || [];
      element('tabCount').textContent = `已選 ${tabs.filter(tab=>tab.included).length} / ${tabs.length}`;
      element('tabs').replaceChildren();
      if (!tabs.length) element('tabs').append(create('div','尚無倉庫分頁','empty'));
      for (const tab of tabs) {
        const label = create('label',null,'tab-label');
        if (/^[a-f0-9]{6}$/i.test(tab.colour)) label.style.borderLeftColor = `#${tab.colour}`;
        const checkbox = create('input'); checkbox.type = 'checkbox'; checkbox.checked = tab.included; checkbox.dataset.tabId = tab.id;
        checkbox.onchange = () => selection(tabs.filter(entry=>entry.id===tab.id ? checkbox.checked : entry.included).map(entry=>entry.id), excludedItems());
        label.append(checkbox, create('span',tab.name), create('small',money(tab.value_divine))); element('tabs').append(label);
      }
    }
    function renderCategories() {
      const categories = state.valuation?.categories || [];
      const previous = element('category').value;
      element('category').replaceChildren(new Option('全部分類',''));
      for (const category of new Set((state.valuation?.resources || []).map(row=>row.category))) element('category').add(new Option(category,category));
      element('category').value = previous;
      element('categories').replaceChildren();
      if (!categories.length) element('categories').append(create('div','尚無分類','empty'));
      for (const category of categories) {
        const ratio = state.valuation.total_divine ? category.value_divine/state.valuation.total_divine*100 : 0;
        const row = create('div',null,'category'); const progress = create('progress'); progress.max=100; progress.value=ratio;
        row.append(create('span',category.id), create('span',percent ? `${ratio.toFixed(1)}%` : money(category.value_divine)),progress); element('categories').append(row);
      }
    }
    function renderRows() {
      const search = element('search').value.trim().toLocaleLowerCase(); const category = element('category').value; const sort = element('sort').value;
      const rows = (state.valuation?.resources || []).filter(row=>(!category || row.category===category) && row.name.toLocaleLowerCase().includes(search));
      rows.sort((first,second)=>sort==='name' ? first.name.localeCompare(second.name,'zh-Hant') : sort==='quantity' ? second.quantity-first.quantity : (second.value_divine ?? -1)-(first.value_divine ?? -1));
      element('rows').replaceChildren();
      if (!rows.length) { const row=create('tr'); const cell=create('td','尚無符合條件的物品','empty'); cell.colSpan=5; row.append(cell); element('rows').append(row); }
      for (const item of rows) {
        const row=create('tr'); const count=create('td'); const checkbox=create('input'); checkbox.type='checkbox'; checkbox.checked=item.included;
        checkbox.onchange=()=>{ const excluded=new Set(excludedItems()); item.item_ids.forEach(id=>checkbox.checked ? excluded.delete(id) : excluded.add(id)); selection(selectedTabs(),[...excluded]); };
        count.append(checkbox); const name=create('td'); const content=create('div',null,'item-name');
        if (/^https:\/\/(web|webtw)\.poecdn\.com\//.test(item.icon)) { const image=create('img'); image.src=item.icon; image.alt=item.name; image.loading='lazy'; content.append(image); }
        const label=create('div'); label.append(create('span',item.name));
        if(item.level != null) label.append(create('div',`Lv${item.level} / 品質${item.quality ?? 0}%${item.corrupted ? ' / 腐化' : ''}`,'muted'));
        content.append(label); name.append(content);
        row.append(count,name,create('td',Number(item.quantity).toLocaleString('zh-Hant'),'number'),create('td',money(item.value_divine),'number'),create('td',item.tabs.join('、'))); element('rows').append(row);
      }
      renderControls();
    }
    function renderChart() {
      const cutoff=Date.now()/1000-Number(element('range').value)*86400;
      let history=(state.history || []).filter(entry=>entry.created_at>=cutoff);
      if (element('chartMode').value==='hourly') { const hours=new Map(); history.forEach(entry=>hours.set(Math.floor(entry.created_at/3600),entry)); history=[...hours.values()].map((entry,index,entries)=>({...entry,total_divine:index ? (entry.total_divine-entries[index-1].total_divine)/Math.max((entry.created_at-entries[index-1].created_at)/3600,1/3600) : null})); }
      element('snapshotCount').textContent=history.length ? `${history.length} 筆快照` : '尚無快照';
      if (chart) chart.destroy();
      if (window.Chart) chart=new Chart(element('historyChart'), {
        type:'line',
        data:{
          labels:history.map(entry=>new Date(entry.created_at*1000).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})),
          datasets:[{data:history.map(entry=>entry.total_divine),borderColor:'#56d6b1',pointRadius:3,tension:0.1}],
        },
        options:{
          responsive:true,maintainAspectRatio:false,animation:false,
          plugins:{legend:{display:false}},
          scales:{x:{ticks:{color:'#a4adb8',maxTicksLimit:4},grid:{display:false}},y:{ticks:{color:'#a4adb8'},grid:{color:'#363d47'}}},
        },
      });
    }
    function openConnectionDialog() {
      element('connectionError').textContent=state.config_error === 'missing+POE_TW_CLIENT_ID'
        ? '本站 OAuth client 尚未設定；可使用下方 POESESSID session 模式連結。'
        : errors[state.config_error] || '帳號連線設定尚未完成。';
      element('connectionRequirements').replaceChildren();
      for(const [key,label] of [['client_id','POE_TW_CLIENT_ID'],['client_secret','POE_TW_CLIENT_SECRET'],['registered_callback','POE_TW_REDIRECT_URI'],['private_storage','私有倉庫儲存']]) {
        const row=create('div',null,'setup-row'); const configured=Boolean(state.connection_setup?.[key]);
        row.append(create('code',label),create('span',configured ? '已設定' : '未設定',configured ? 'selected' : 'notice'));
        element('connectionRequirements').append(row);
      }
      element('connectionDialog').showModal();
    }
    element('connect').onclick=event=>{if(!state.oauth_configured){event.preventDefault();openConnectionDialog();}};
    element('connectionSettings').onclick=openConnectionDialog;
    element('closeConnectionDialog').onclick=()=>element('connectionDialog').close();
    element('sessionConsent').onchange=renderControls;
    element('sessionForm').onsubmit=async event=>{
      event.preventDefault();
      if(busy || !element('sessionConsent').checked) return;
      busy=true; renderControls(); element('connectionError').textContent='正在驗證並同步…';
      const payload={account_name:element('sessionAccount').value.trim(),poe_session:element('sessionCookie').value,game:'poe1',league:element('league').value,accepted_risk:true};
      try {
        const response=await fetch('/api/stash/session/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const result=await response.json();
        if(!response.ok) throw new Error(result.message || 'Session 連結失敗');
        history.replaceState(null,'',window.location.pathname);
        element('connectionDialog').close();
        await loadState();
        element('notice').textContent='倉庫已同步。連線使用 POESESSID session-cookie，非官方 OAuth。';
      } catch(error) {
        element('connectionError').textContent=error.message;
      } finally {
        element('sessionCookie').value='';
        busy=false; renderControls();
      }
    };
    element('sync').onclick=()=>action('/api/stash/sync',{game:'poe1',league:element('league').value});
    element('disconnect').onclick=()=>{ if (confirm('斷開帳號並清除本站倉庫資料？')) action('/api/stash/disconnect',{}); };
    element('allTabs').onclick=()=>selection((state.valuation?.tabs || []).map(tab=>tab.id),excludedItems());
    element('clearTabs').onclick=()=>selection([],excludedItems());
    element('percent').onclick=()=>{percent=!percent;element('percent').setAttribute('aria-pressed',String(percent));renderCategories();};
    element('search').oninput=renderRows; element('category').onchange=renderRows; element('sort').onchange=renderRows;
    element('range').onchange=renderChart; element('chartMode').onchange=renderChart;
    element('autoSync').onchange=()=>{clearInterval(autoTimer);if(element('autoSync').checked)autoTimer=setInterval(()=>{if(!busy)element('sync').click();},900000);};
    loadState().catch(error=>{element('notice').textContent=error.message;});
  </script>
</body>
</html>
